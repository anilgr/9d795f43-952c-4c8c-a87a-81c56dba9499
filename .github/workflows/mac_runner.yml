name: Debug macOS Runner via Web Browser

on:
  workflow_dispatch:
    inputs:
      clone_padaku:
        description: 'Clone Padaku repository'
        required: true
        default: true
        type: boolean
      build_padaku:
        description: ' ↳ Start background iOS build automatically'
        required: false
        default: false
        type: boolean
      padaku_branch:
        description: ' ↳ Branch to clone (only used if clone_padaku is checked)'
        required: false
        default: 'master'
        type: string
      release_build:
        description: ' ↳ Release build (bundled JS, no Metro server needed)'
        required: false
        default: false
        type: boolean
      install_tools:
        description: 'Install Maestro CLI, Antigravity CLI & cap screenshot helper'
        required: true
        default: true
        type: boolean

jobs:
  debug-mac-session:
    runs-on: macos-latest # Tells GitHub to use an Apple Silicon (M1/M2/M3) macOS machine
    env:
      CI: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Optimize Runner Memory
        run: |
          echo "Disabling Spotlight indexing..."
          sudo mdutil -a -i off || true
          echo "Shutting down and erasing pre-warmed iOS Simulators..."
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          echo "Purging inactive disk and memory cache..."
          sudo purge || true

      - name: Cache Homebrew Downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brew-cache-${{ runner.os }}-

      - name: Install ttyd and lrzsz (Zmodem) via Homebrew
        run: |
          # Homebrew is pre-installed on GitHub macOS runners
          brew update
          brew install ttyd lrzsz

      - name: Install Ngrok Tunnel on Mac
        run: |
          brew install ngrok

      - name: Install Maestro, Antigravity CLI and Setup Helpers
        if: ${{ inputs.install_tools }}
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          
          # Setup fast & robust 'cap' command to capture simulator screenshot and generate instant preview URL
          sudo tee /usr/local/bin/cap > /dev/null << 'EOF'
          #!/usr/bin/env bash
          file="${1:-/tmp/sim_cap.png}"
          echo "📸 Capturing iOS simulator screenshot to $file..."

          # 1. Verify a booted simulator exists
          if ! xcrun simctl list devices booted | grep -q "Booted"; then
            echo "❌ Error: No booted iOS simulator found! Boot one first with 'boot_ios_sim.sh'."
            exit 1
          fi

          # 2. Wake Simulator app so it renders an active frame (prevents CoreSimulator display hang)
          open -a Simulator 2>/dev/null || true
          osascript -e 'tell application "Simulator" to activate' 2>/dev/null || true

          # 3. Take screenshot with --mask=ignored and 10s watchdog timeout
          rm -f "$file"
          ( xcrun simctl io booted screenshot --mask=ignored --type=png "$file" ) &
          pid=$!

          for i in {1..10}; do
            if ! kill -0 $pid 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 $pid 2>/dev/null; then
            echo "⚠️ 'xcrun simctl io screenshot' timed out after 10s. Forcing kill..."
            kill -9 $pid 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$file" ]; then
            echo "❌ Screenshot failed: $file is empty or was not created."
            exit 1
          fi

          filesize=$(du -h "$file" | cut -f1)
          echo "✅ Screenshot captured ($file, $filesize)."
          echo "🚀 Generating instant web preview URL..."

          # Upload to temp.sh for instant browser viewing (bypasses browser WebSocket download blocks)
          preview_url=$(curl -s -F "file=@$file" https://temp.sh/upload || true)

          echo "=========================================================="
          if [ -n "$preview_url" ]; then
            echo "🔗 VIEW SCREENSHOT HERE:"
            echo "$preview_url"
          else
            echo "⚠️ Cloud upload failed. File saved locally at $file"
          fi
          echo "=========================================================="
          EOF
          sudo chmod +x /usr/local/bin/cap
          
          cat << 'EOF' >> $HOME/.bashrc
          alias simcap='cap'
          alias sc='cap'
          EOF
          cat << 'EOF' >> $HOME/.bash_profile
          if [ -f ~/.bashrc ]; then . ~/.bashrc; fi
          EOF

      - name: Clone Private Padaku Repository
        if: ${{ inputs.clone_padaku }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PADAKU_BRANCH: ${{ inputs.padaku_branch || 'master' }}
        run: |
          echo "Cloning Padaku branch: ${PADAKU_BRANCH}..."
          git clone -b "${PADAKU_BRANCH}" https://${GH_PAT}@github.com/anilgr/Padaku.git

      - name: Cache Yarn, node_modules, CocoaPods, and Pods
        if: ${{ inputs.clone_padaku }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            Padaku/node_modules
            ~/Library/Caches/CocoaPods
            Padaku/ios/Pods
          key: padaku-deps-${{ runner.os }}-${{ hashFiles('Padaku/yarn.lock', 'Padaku/ios/Podfile.lock') }}
          restore-keys: |
            padaku-deps-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        if: ${{ inputs.clone_padaku }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: padaku-derived-${{ runner.os }}-${{ inputs.release_build && 'release' || 'debug' }}-${{ hashFiles('Padaku/ios/Podfile.lock', 'Padaku/yarn.lock') }}
          restore-keys: |
            padaku-derived-${{ runner.os }}-${{ inputs.release_build && 'release' || 'debug' }}-
            padaku-derived-${{ runner.os }}-

      - name: Start Background Build (Yarn & iOS)
        if: ${{ inputs.clone_padaku && inputs.build_padaku }}
        env:
          PADAKU_BRANCH: ${{ inputs.padaku_branch || 'master' }}
        run: |
          if [ "${{ inputs.release_build }}" = "true" ]; then
            echo "📦 Running RELEASE build (bundled JS, no Metro)..."
            nohup bash -c "cd Padaku && yarn install && yarn ios --configuration Release" > /tmp/build.log 2>&1 &
          else
            echo "🔧 Running DEBUG build (Metro on port 8085)..."
            nohup bash -c "cd Padaku && yarn install && yarn ios --port 8085" > /tmp/build.log 2>&1 &
          fi
          echo "🔨 Background build started on branch '${PADAKU_BRANCH}'. Monitor with: tail -f /tmp/build.log"

      - name: Start ttyd and Expose Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          TTYD_USER: ${{ secrets.TTYD_USER || 'admin' }}
          TTYD_PASS: ${{ secrets.TTYD_PASSWORD || 'runnerpass' }}
        run: |
          if command -v ngrok &> /dev/null && [ -n "$NGROK_AUTHTOKEN" ]; then
            ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          fi
          
          if command -v ttyd &> /dev/null; then
            nohup ttyd -W -t enableZmodem=true -p 8080 -c "$TTYD_USER:$TTYD_PASS" bash > ttyd.log 2>&1 &
          fi
          
          if command -v ngrok &> /dev/null; then
            nohup ngrok http 8080 > ngrok.log 2>&1 &
            sleep 5
            PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
            echo "=========================================================="
            echo "🚀 ACCESS YOUR MAC RUNNER TERMINAL HERE:"
            echo "$PUBLIC_URL"
            echo "🔐 Credentials -> User: $TTYD_USER | Pass: $TTYD_PASS"
            echo "📸 To take an iOS screenshot & get a direct link: cap (or simcap / sc)"
            echo "📥 To download files to your browser via Zmodem: sz <filename>"
            echo "📤 To upload files from your browser via Zmodem: rz"
            echo "=========================================================="
          fi

      - name: Keep Mac Runner Open (Interactive Loop)
        run: |
          echo "🔄 The Mac runner is locked open for debugging."
          echo "👉 To close the session and stop billing, type: touch /tmp/stop_debug"
          
          # Infinite loop scanning for our kill-switch file
          while [ ! -f /tmp/stop_debug ]; do
            sleep 5
          done
          
          echo "🛑 Kill switch file detected. Cleaning up Mac runner."
